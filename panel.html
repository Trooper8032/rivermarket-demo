<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.46.0/tabler-icons.min.css"><link rel="stylesheet" href="assets/css/theme.css"><script src="assets/js/app.js"></script><title>Panel del vendedor · RiverMarket</title></head><body class="text-gray-600"><div id="cab"></div>
<section class="container my-8">
<div id="lg" class="max-w-md mx-auto border border-gray-300 rounded-2xl p-6 md:p-8"><div class="w-14 h-14 rounded-full bg-green-100 text-green-700 grid place-items-center mb-3"><i class="ti ti-lock text-[28px]"></i></div><h1 class="text-xl mb-1">Panel del vendedor</h1>
<p class="mb-4 text-sm bg-yellow-50 border border-yellow-300 rounded-lg p-3 text-yellow-800">Acceso de demostración: elige una tienda de ejemplo. No se usan contraseñas.</p>
<label class="font-medium text-gray-800">Tienda</label><select id="sel" class="${INP}"></select><button class="${BTN} w-full" onclick="entrar()">Entrar al panel</button>
<p class="text-center mt-4 text-sm"><a href="#" class="text-green-600" onclick="if(confirm('¿Restaurar los datos de ejemplo? Se borrarán tus cambios.')){reiniciar();location.reload()}return false">Restaurar datos de ejemplo</a></p></div>
<div id="pn" class="hidden"><div class="flex flex-wrap justify-between items-center gap-3 mb-4"><div class="flex items-center gap-3"><div id="tl" class="w-12 h-12 rounded-xl text-white grid place-items-center"></div><div><div class="text-sm">Panel del vendedor</div><h1 id="tn" class="text-xl"></h1></div></div>
<div class="flex gap-2"><a id="ver" target="_blank" class="${BTN} btn-sm"><i class="ti ti-external-link"></i> Ver mi tienda</a><button class="${BTNO} btn-sm" onclick="localStorage.removeItem('rg_sesion2');location.reload()">Salir</button></div></div>
<div class="grid grid-cols-3 gap-3 mb-5" id="kp"></div>
<div class="flex border-b border-gray-300 mb-5 overflow-x-auto" id="tabs"><button class="px-4 py-2 font-semibold border-b-2">Productos</button><button class="px-4 py-2 font-semibold border-b-2">Mi tienda</button><button class="px-4 py-2 font-semibold border-b-2">Registros</button></div>
<div id="t0"><form id="fp" novalidate class="border border-gray-300 rounded-lg p-5 mb-5"><h3 class="text-md mb-3" id="fpt">Nuevo producto</h3><input type="hidden" name="id"><div class="grid md:grid-cols-2 lg:grid-cols-4 gap-x-4">
<div><label class="font-medium text-gray-800">Nombre</label><input name="nombre" class="${INP}"></div><div><label class="font-medium text-gray-800">Categoría</label><input name="cat" list="cats" class="${INP}"><datalist id="cats"></datalist></div>
<div><label class="font-medium text-gray-800">Precio (S/)</label><input name="precio" inputmode="decimal" placeholder="0.00" class="${INP}"></div><div><label class="font-medium text-gray-800">URL de la foto (opcional)</label><input name="img" placeholder="https://..." class="${INP}"></div></div>
<div id="fe" class="text-red-600 text-sm mb-3"></div><div class="flex gap-2"><button class="${BTN}"><i class="ti ti-device-floppy"></i> Guardar producto</button><button type="button" class="${BTNO}" onclick="limpiar()">Limpiar</button></div></form>
<div class="grid gap-3" id="tb"></div></div>
<div id="t1" class="hidden"><form id="fs" class="border border-gray-300 rounded-lg p-5 max-w-2xl"><label class="font-medium text-gray-800">Nombre de la tienda</label><input name="nombre" required class="${INP}"><label class="font-medium text-gray-800">Descripción</label><input name="desc" class="${INP}"><label class="font-medium text-gray-800">Rubro</label><input name="rubro" class="${INP}">
<label class="font-medium text-gray-800">WhatsApp para pedidos (con código de país, ej. 51971941531)</label><input name="wa" required pattern="[0-9]{9,15}" class="${INP}"><label class="font-medium text-gray-800">Color de la tienda</label><input name="color" type="color" class="${INP} h-12">
<button class="${BTN}">Guardar cambios</button><div id="m1" class="mt-3"></div></form></div>
<div id="t2" class="hidden"><div class="border border-gray-300 rounded-lg p-5"><p class="mb-3">Negocios registrados desde el formulario de la página principal (guardados en este navegador).</p><div id="sol" class="overflow-x-auto"></div></div></div>
</div></section><div id="pie"></div>
<script>document.querySelectorAll("[class*=\"${\"]").forEach(e=>e.className=e.className.replace(/\$\{(\w+)\}/g,(m,k)=>eval(k))); montar('panel');let d=cargar(),T;const P=i=>T.productos.find(p=>p.id==i);
sel.innerHTML=d.tiendas.map(t=>`<option value="${t.id}">${esc(t.nombre)}</option>`).join('');
function entrar(){localStorage.setItem('rg_sesion2',sel.value);ini()}
function cab(){tn.textContent=T.nombre;tl.style.background=T.color;tl.innerHTML=`<i class="ti ${esc(T.icono)} text-[26px]"></i>`;const a=T.productos.filter(p=>p.activo).length;
kp.innerHTML=[['Productos',T.productos.length],['Visibles',a],['Categorías',new Set(T.productos.map(p=>p.cat)).size]].map(([t,n])=>`<div class="rounded-lg bg-gray-100 p-4"><div class="text-2xl font-bold text-gray-800">${n}</div><div class="text-sm">${t}</div></div>`).join('');cats.innerHTML=[...new Set(T.productos.map(p=>p.cat))].map(c=>`<option value="${esc(c)}">`).join('')}
function ini(){T=d.tiendas.find(t=>t.id==localStorage.getItem('rg_sesion2'));if(!T)return;lg.classList.add('hidden');pn.classList.remove('hidden');ver.href='tienda.html?t='+T.id;for(const k of['nombre','desc','rubro','wa','color'])fs[k].value=T[k];cab();rt();tab(0);
sol.innerHTML=d.solicitudes.length?'<table class="w-full text-left"><tr class="text-gray-800"><th class="p-2">Fecha</th><th class="p-2">Negocio</th><th class="p-2">WhatsApp</th><th class="p-2">Rubro</th></tr>'+d.solicitudes.map(s=>`<tr class="border-t border-gray-200"><td class="p-2">${esc(s.fecha)}</td><td class="p-2"><b>${esc(s.negocio)}</b><br>${esc(s.nombre)}</td><td class="p-2">${esc(s.wa)}</td><td class="p-2">${esc(s.rubro)}</td></tr>`).join('')+'</table>':'<p>Aún no hay registros.</p>'}
function tab(i){[...tabs.children].forEach((b,j)=>{b.onclick=()=>tab(j);b.className='px-4 py-2 font-semibold border-b-2 '+(i==j?'border-green-600 text-green-600':'border-transparent')});[t0,t1,t2].forEach((e,j)=>e.classList.toggle('hidden',i!=j))}
function rt(){tb.innerHTML=T.productos.map(p=>`<div class="flex items-center gap-3 border border-gray-300 rounded-lg p-3 bg-white ${p.activo?'':'opacity-60'}"><img src="${esc(p.img)}" onerror="this.src='assets/images/demo/sin-foto.svg'" class="w-16 h-16 rounded-lg object-cover"><div class="flex-1 min-w-0"><div class="font-semibold text-gray-800 truncate">${esc(p.nombre)}</div><div class="text-sm">${esc(p.cat)} · <b class="text-gray-800">${soles(p.precio)}</b></div>
<label class="text-sm inline-flex items-center gap-1 mt-1"><input type="checkbox" class="rounded text-green-600" ${p.activo?'checked':''} onchange="vis('${p.id}',this.checked)"> Visible en la tienda</label></div>
<div class="flex flex-col sm:flex-row gap-1"><button class="${BTNO} btn-sm" onclick="ed('${p.id}')"><i class="ti ti-pencil"></i> Editar</button><button class="${BTNO} btn-sm !text-red-600" onclick="del('${p.id}')"><i class="ti ti-trash"></i> Borrar</button></div></div>`).join('')||'<p>No tienes productos todavía.</p>'}
function vis(i,v){P(i).activo=v;guardar(d);rt();cab()}
function limpiar(){fp.reset();fp.id.value='';fe.textContent='';fpt.textContent='Nuevo producto'}
function ed(i){const p=P(i);for(const k of['id','nombre','cat','img'])fp[k].value=p[k]||'';fp.precio.value=Number(p.precio).toFixed(2);fpt.textContent='Editar producto';fe.textContent='';fp.scrollIntoView({behavior:'smooth'})}
function del(i){if(confirm('¿Borrar este producto?')){T.productos=T.productos.filter(p=>p.id!=i);guardar(d);rt();cab()}}
fp.onsubmit=e=>{e.preventDefault();const v=Object.fromEntries(new FormData(fp));v.nombre=v.nombre.trim();v.cat=v.cat.trim();const pr=precioValido(v.precio);const er=[];if(!v.nombre)er.push('el nombre');if(!v.cat)er.push('la categoría');if(pr===null)er.push('un precio válido mayor a 0 (ej. 25.90)');if(v.img&&!/^https?:\/\//.test(v.img)&&!v.img.startsWith(IMG))er.push('una URL de foto que empiece con https://');
if(er.length)return fe.textContent='Falta '+er.join(', ')+'.';v.precio=pr;v.img=v.img||'assets/images/demo/sin-foto.svg';if(v.id)Object.assign(P(v.id),v);else T.productos.unshift({...v,id:'p'+Date.now().toString(36),activo:true});guardar(d);limpiar();rt();cab()}
fs.onsubmit=e=>{e.preventDefault();const v=Object.fromEntries(new FormData(fs));v.wa=v.wa.replace(/\D/g,'');Object.assign(T,v);guardar(d);cab();m1.innerHTML='<div class="p-3 rounded-lg bg-green-100 text-green-800">✅ Guardado. Ya se ve en tu tienda.</div>'}
ini()</script></body></html>
