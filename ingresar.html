<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.46.0/tabler-icons.min.css"><link rel="stylesheet" href="assets/css/theme.css"><link rel="manifest" id="mf" href="manifest.webmanifest"><meta name="theme-color" content="#0aad0a"><link rel="icon" href="assets/images/icono-192.png"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script><script src="assets/js/rm.js"></script><title>Ingresar · RiverMarket</title></head><body class="text-gray-600"><div id="cab"></div>
<section class="container my-10"><div class="max-w-md mx-auto border border-gray-300 rounded-2xl p-6 md:p-8">
<div id="vLogin"><h1 class="text-xl mb-1">Ingresar</h1><p class="mb-5">Panel de vendedores y administración.</p>
<form id="fl"><label class="${LBL}">Correo</label><input name="email" type="email" required autocomplete="email" class="${INP}"><label class="${LBL}">Contraseña</label><input name="password" type="password" required autocomplete="current-password" class="${INP}">
<div id="el" class="text-sm text-red-600 mb-2"></div><button class="${BTN} w-full">Ingresar</button></form>
<p class="text-center mt-4 text-sm"><a href="#" onclick="vista('vRec');return false" class="text-green-600">¿Olvidaste tu contraseña?</a> · <a href="registro.html" class="text-green-600">Crear cuenta de vendedor</a></p></div>
<div id="vRec" class="hidden"><h1 class="text-xl mb-1">Recuperar contraseña</h1><p class="mb-5">Te enviaremos un enlace a tu correo.</p><form id="fr"><label class="${LBL}">Correo</label><input name="email" type="email" required class="${INP}"><div id="er" class="text-sm mb-2"></div><button class="${BTN} w-full">Enviar enlace</button></form><p class="text-center mt-4 text-sm"><a href="#" onclick="vista('vLogin');return false" class="text-green-600">Volver</a></p></div>
<div id="vPass" class="hidden"><h1 class="text-xl mb-1">Crea tu contraseña</h1><p class="mb-5" id="pmsg">Mínimo 8 caracteres.</p><form id="fp"><label class="${LBL}">Nueva contraseña</label><input name="p1" type="password" minlength="8" required autocomplete="new-password" class="${INP}"><label class="${LBL}">Repite la contraseña</label><input name="p2" type="password" minlength="8" required autocomplete="new-password" class="${INP}"><div id="ep" class="text-sm text-red-600 mb-2"></div><button class="${BTN} w-full">Guardar contraseña</button></form></div>
<div id="vOk" class="hidden text-center"><div class="w-16 h-16 mx-auto rounded-full bg-green-100 text-green-700 grid place-items-center mb-3"><i class="ti ti-mail-check text-3xl"></i></div><h1 class="text-xl mb-2" id="okt"></h1><p id="okm"></p></div>
</div></section><div id="pie"></div>
<script>fixClases();montar('ing');const vista=v=>['vLogin','vRec','vPass','vOk'].forEach(x=>$(x).classList.toggle('hidden',x!=v));
const H=new URLSearchParams(location.hash.slice(1)),tipo=H.get('type');
if(H.get('error_description')){vista('vOk');okt.textContent='El enlace no es válido';okm.textContent=H.get('error_description').replace(/\+/g,' ')+'. Pide uno nuevo.'}
async function destino(){const pf=await perfil();if(pf&&pf.rol=='admin')return 'admin.html';const s=await sesion();const {data:t}=await sb.from('tiendas').select('id').eq('owner',s.user.id).maybeSingle();return t?'panel.html':'verificar.html'}
sb.auth.onAuthStateChange(async(ev,s)=>{if(ev=='PASSWORD_RECOVERY'||(s&&(tipo=='invite'||tipo=='recovery'))){vista('vPass');pmsg.textContent=tipo=='invite'?'Bienvenido. Crea tu contraseña para entrar al panel.':'Escribe tu nueva contraseña.'}
else if(s&&tipo=='signup'){vista('vOk');okt.textContent='¡Correo confirmado!';okm.textContent='Te llevamos a la verificación de tu tienda…';setTimeout(async()=>location.href=await destino(),1500)}});
fl.onsubmit=async e=>{e.preventDefault();el.textContent='';const v=Object.fromEntries(new FormData(fl));const {error}=await sb.auth.signInWithPassword(v);if(error)return el.textContent=errTxt(error);location.href=await destino()};
fr.onsubmit=async e=>{e.preventDefault();const {error}=await sb.auth.resetPasswordForEmail(fr.email.value,{redirectTo:location.origin+location.pathname});er.className='text-sm mb-2 '+(error?'text-red-600':'text-green-700');er.textContent=error?errTxt(error):'Listo. Revisa tu correo (también en spam).'};
fp.onsubmit=async e=>{e.preventDefault();if(fp.p1.value!=fp.p2.value)return ep.textContent='Las contraseñas no coinciden.';const {error}=await sb.auth.updateUser({password:fp.p1.value});if(error)return ep.textContent=errTxt(error);history.replaceState(null,'',location.pathname);location.href=await destino()};
</script></body></html>
