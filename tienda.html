<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.46.0/tabler-icons.min.css"><link rel="stylesheet" href="assets/css/theme.css"><script src="assets/js/app.js"></script><title>Tienda</title><link rel="manifest" id="mf" href="manifest.webmanifest"><meta name="theme-color" content="#0aad0a"><link rel="apple-touch-icon" href="assets/images/icono-192.png"></head><body class="text-gray-600 pb-20"><div id="cab"></div>
<div id="thw"></div><div id="bv"></div>
<section class="container my-6"><div class="flex flex-col md:flex-row gap-3 md:items-center justify-between"><div class="flex gap-2 overflow-x-auto pb-1" id="fc"></div>
<div class="flex gap-2" id="bus"><div class="relative flex-1 md:w-64"><i class="ti ti-search absolute left-3 top-3"></i><input id="q" placeholder="Buscar producto" class="border border-gray-300 rounded-lg w-full p-2 pl-9"></div>
<select id="ord" class="border border-gray-300 rounded-lg p-2"><option value="">Ordenar</option><option value="a">Precio: menor</option><option value="d">Precio: mayor</option></select></div></div>
<p class="text-sm mt-3" id="res"></p><div id="g" class="grid gap-4 grid-cols-2 md:grid-cols-3 xl:grid-cols-4 mt-2"></div></section>
<button onclick="abrir()" class="fixed bottom-4 right-4 z-30 ${BTN} tb shadow-lg !rounded-full !px-5 !py-3"><i class="ti ti-shopping-cart text-lg"></i> <span id="cn">0</span> · <span id="tt"></span></button>
<div id="dr" class="fixed inset-0 z-40 bg-black/50 hidden" onclick="if(event.target==this)cerrar()"><div class="absolute right-0 top-0 bottom-0 w-full max-w-md bg-white p-6 overflow-y-auto">
<div class="flex justify-between items-center mb-4"><h3>Tu carrito</h3><button onclick="cerrar()" class="text-xl"><i class="ti ti-x"></i></button></div>
<div id="it"></div><div class="flex justify-between text-md font-semibold text-gray-800 py-4 border-t border-gray-300"><span>Total</span><span id="tot"></span></div>
<label class="font-medium text-gray-800">Tu nombre</label><input id="cnom" class="${INP}"><label class="font-medium text-gray-800">Entrega</label><select id="cent" class="${INP}"><option>Delivery</option><option>Recojo en tienda</option></select>
<label class="font-medium text-gray-800">Dirección / referencia</label><input id="cdir" class="${INP}"><label class="font-medium text-gray-800">Nota</label><textarea id="cnot" rows="2" class="${INP}"></textarea><div id="err" class="text-red-600 text-sm mb-2"></div>
<button onclick="enviar()" class="${WAC} w-full"><i class="ti ti-brand-whatsapp text-lg"></i> Enviar pedido por WhatsApp</button><button onclick="cerrar()" class="${BTNO} w-full mt-2">Seguir comprando</button></div></div>
<section class="container" id="tpiew"><div id="tpie" class="rounded-lg bg-gray-100 p-4 text-sm flex flex-wrap gap-x-6 gap-y-1"></div><div id="inst" class="hidden mt-3"><button onclick="instalar()" class="${BTNO} btn-sm"><i class="ti ti-download"></i> Instalar tienda en mi celular</button></div></section>
<div id="pie"></div>
<script>document.querySelectorAll("[class*=\"${\"]").forEach(e=>e.className=e.className.replace(/\$\{(\w+)\}/g,(m,k)=>eval(k))); montar('');
const d=cargar(),id=new URLSearchParams(location.search).get('t'),T=d.tiendas.find(x=>x.id==id)||d.tiendas[0];document.title=T.nombre+' · RiverMarket';if(['dulce-hogar','tecno-punto','verde-vivo','moda-urbana'].includes(T.id))mf.href=T.id+'/manifest.webmanifest';
tpie.innerHTML=`<b class="text-gray-800">${esc(T.nombre)}</b>${T.ruc?`<span>RUC ${esc(T.ruc)}</span>`:''}<span><i class="ti ti-brand-whatsapp"></i> +${esc(T.wa)}</span><span>Precios en soles. Stock referencial (demo).</span>`;
const PRV=new URLSearchParams(location.search).has('preview');if(PRV){try{Object.assign(T,JSON.parse(localStorage.getItem('rg_preview')||'{}'))}catch(e){}}
const C=cfg(T),col=T.color||'#0aad0a';document.body.style.setProperty('--c',col);
const ban=T.banner?`<img src="${src(T.banner)}" alt="" class="absolute inset-0 w-full h-full object-cover">`:'';
if(C.estilo=='moderna'){thw.innerHTML=C.secc.portada?`<section class="relative h-64 md:h-80 overflow-hidden" style="background:${col}">${ban}<div class="absolute inset-0" style="background:linear-gradient(to top,${col}ee,${col}33 60%,transparent)"></div><div class="absolute inset-x-0 bottom-0 container pb-6 text-center text-white">${logoHTML(T,'w-24 h-24 rounded-full mx-auto border-4 border-white shadow-lg','text-[44px]')}<h1 class="text-white text-2xl md:text-3xl mt-2">${esc(T.nombre)}</h1><p class="text-white/90">${esc(T.desc)}</p></div></section>`:`<section class="container pt-6 text-center">${logoHTML(T,'w-20 h-20 rounded-full mx-auto shadow','text-[40px]')}<h1 class="text-2xl mt-2">${esc(T.nombre)}</h1><p>${esc(T.desc)}</p></section>`}
else if(C.estilo=='minimal'){thw.innerHTML=`<section class="container pt-8 pb-2"><div class="flex items-center gap-4 border-b border-gray-200 pb-5">${logoHTML(T,'w-14 h-14 rounded-lg flex-none','text-[28px]')}<div><h1 class="text-xl md:text-2xl font-semibold">${esc(T.nombre)}</h1><p class="text-sm">${esc(T.desc)}</p></div></div>${C.secc.portada&&T.banner?`<div class="relative h-40 md:h-56 mt-5 rounded-lg overflow-hidden">${ban}</div>`:''}</section>`}
else{thw.innerHTML=`<section class="container mt-6"><div class="rounded-2xl overflow-hidden relative" style="background:${col}">${C.secc.portada?ban.replace('class="','class="opacity-40 '):''}<div class="relative p-6 md:p-10 flex items-center gap-4">${logoHTML(T,'w-20 h-20 flex-none rounded-2xl shadow border-4 border-white','text-[42px]')}<div class="text-white"><span class="inline-block text-sm bg-white/20 rounded px-2 py-0.5 mb-1">Tienda de ejemplo</span><h1 class="text-white text-2xl md:text-3xl">${esc(T.nombre)}</h1><p class="text-white/90">${esc(T.desc)}</p></div></div></div></section>`}
if(C.estilo!='clasica')thw.insertAdjacentHTML('beforeend',`<div class="container"><span class="inline-block text-sm bg-gray-100 rounded px-2 py-0.5 mt-3">Tienda de ejemplo</span></div>`);
bv.innerHTML=C.secc.bienvenida&&C.bienvenida?`<div class="container mt-4"><div class="rounded-lg px-4 py-3 font-medium text-center" style="background:${col}1a;color:${col}"><i class="ti ti-speakerphone"></i> ${esc(C.bienvenida)}</div></div>`:'';
if(!C.secc.buscador)bus.classList.add('hidden');if(!C.secc.categorias)fc.classList.add('hidden');if(!C.secc.info)tpiew.classList.add('hidden');
const RAD=C.estilo=='moderna'?'rounded-2xl':C.estilo=='minimal'?'rounded-md':'rounded-lg';
if(C.vista=='lista')g.className='grid gap-3 grid-cols-1 md:grid-cols-2 mt-2';
document.head.insertAdjacentHTML('beforeend',`<style>.tb{background:${col}!important;border-color:${col}!important;color:#fff!important}.tb:hover{filter:brightness(.92)}.tchip{background:${col}!important;border-color:${col}!important;color:#fff!important}</style>`);
let cat='Todas';const todo=JSON.parse(localStorage.getItem('rg_carrito2')||'{}');let car=todo[T.id]||{};
const act=()=>T.productos.filter(p=>p.activo),P=i=>T.productos.find(x=>x.id==i);
function gc(){const a=JSON.parse(localStorage.getItem('rg_carrito2')||'{}');a[T.id]=car;localStorage.setItem('rg_carrito2',JSON.stringify(a))}
function rf(){fc.innerHTML=['Todas',...new Set(act().map(p=>p.cat))].map(c=>`<button data-c="${esc(c)}" class="flex-none px-4 py-2 rounded-full border font-medium ${c==cat?'tchip':'bg-white border-gray-300 text-gray-800'} ${C.estilo=='minimal'?'!rounded-md':''}">${esc(c)}</button>`).join('');fc.querySelectorAll('button').forEach(b=>b.onclick=()=>{cat=b.dataset.c;rf();rg()})}
function rg(){const t=q.value.toLowerCase();let l=act().filter(p=>(cat=='Todas'||p.cat==cat)&&p.nombre.toLowerCase().includes(t));if(ord.value)l.sort((a,b)=>ord.value=='a'?a.precio-b.precio:b.precio-a.precio);res.textContent=l.length+' productos';
g.innerHTML=l.map(p=>{const pr=`<span class="leading-tight"><span class="font-bold text-gray-900 whitespace-nowrap block">${soles(p.precio)}</span>${descuento(p)?`<s class="text-sm text-gray-500 whitespace-nowrap">${soles(p.antes)}</s>`:''}</span>`,bt=`<button ${p.stock<=0?'disabled':''} onclick="add('${p.id}',1)" aria-label="Agregar" class="${BTN} tb btn-sm ${C.estilo=='moderna'?'!rounded-full':''}"><i class="ti ti-plus"></i><span class="hidden sm:inline">Agregar</span></button>`,im=`<img src="${esc(src(p.img))}" alt="${esc(p.nombre)}" class="w-full h-full object-cover" onerror="this.src='assets/images/demo/sin-foto.svg'">`,bd=C.estilo=='minimal'?'border border-transparent hover:border-gray-200':C.estilo=='moderna'?'shadow-md hover:shadow-xl':'border border-gray-300 hover:shadow-lg';
if(C.vista=='lista')return `<div class="${RAD} ${bd} bg-white overflow-hidden transition flex"><div class="w-28 h-28 flex-none relative overflow-hidden bg-gray-100">${badges(p)}${im}</div><div class="p-3 flex flex-col flex-1 min-w-0"><span class="text-sm text-gray-500">${esc(p.cat)}</span><h3 class="text-base font-semibold text-gray-800 truncate">${esc(p.nombre)}</h3><div class="flex items-center justify-between mt-auto">${pr}${bt}</div></div></div>`;
return `<div class="${RAD} ${bd} bg-white overflow-hidden transition flex flex-col"><div class="aspect-square overflow-hidden bg-gray-100 relative ${C.estilo=='minimal'?RAD:''}">${badges(p)}${im}</div><div class="p-3 flex flex-col flex-1 ${C.estilo=='moderna'?'text-center':''}"><span class="text-sm text-gray-500">${esc(p.cat)}</span><h3 class="text-base font-semibold text-gray-800 my-1 flex-1">${esc(p.nombre)}</h3><div class="flex items-center justify-between mt-2">${pr}${bt}</div></div></div>`}).join('')||'<p class="col-span-full">No hay productos con ese filtro.</p>';rc()}
function badges(p){const d=descuento(p);let h='';if(d)h+=`<span class="absolute top-2 left-2 z-10 bg-red-600 text-white text-sm font-bold rounded px-2 py-0.5">-${d}%</span>`;if(p.stock<=0)h+=`<span class="absolute inset-0 z-10 bg-white/60 grid place-items-center"><span class="bg-gray-800 text-white font-semibold rounded px-3 py-1">Agotado</span></span>`;else if(p.stock<=POCOS)h+=`<span class="absolute bottom-2 left-2 z-10 bg-yellow-400 text-gray-900 text-sm font-semibold rounded px-2 py-0.5">¡Quedan ${p.stock}!</span>`;return h}
function add(i,n){const p=P(i);if(n>0&&(car[i]||0)+n>p.stock){aviso(p.stock<=0?'Producto agotado.':`Solo quedan ${p.stock} unidades de ${p.nombre}.`);return}car[i]=(car[i]||0)+n;if(car[i]<=0)delete car[i];gc();rc();ri()}
function total(){return Object.entries(car).reduce((s,[i,n])=>s+(P(i)?P(i).precio*n:0),0)}
function rc(){cn.textContent=Object.entries(car).reduce((a,[i,n])=>a+(P(i)?n:0),0);tt.textContent=soles(total())}
function ri(){it.innerHTML=Object.entries(car).map(([i,n])=>{const p=P(i);return p?`<div class="flex items-center gap-3 py-3 border-b border-gray-200"><img src="${esc(src(p.img))}" class="w-16 h-16 rounded-lg object-cover"><div class="flex-1"><div class="font-medium text-gray-800">${esc(p.nombre)}</div><div class="text-sm">${soles(p.precio)}</div></div><div class="flex items-center border border-gray-300 rounded-lg"><button class="px-2 py-1" onclick="add('${i}',-1)">−</button><span class="px-2">${n}</span><button class="px-2 py-1" onclick="add('${i}',1)">+</button></div></div>`:''}).join('')||'<p class="py-6 text-center">Tu carrito está vacío.</p>';tot.textContent=soles(total())}
function aviso(t){let e=document.getElementById('toast');if(!e){e=document.createElement('div');e.id='toast';e.className='fixed top-20 left-1/2 -translate-x-1/2 z-50 bg-gray-800 text-white rounded-lg px-4 py-2 shadow-lg';document.body.appendChild(e)}e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',2500)}
function abrir(){ri();dr.classList.remove('hidden')}function cerrar(){dr.classList.add('hidden')}
function enviar(){err.textContent='';if(!total())return err.textContent='Agrega al menos un producto.';if(!cnom.value.trim())return err.textContent='Escribe tu nombre.';if(cent.value=='Delivery'&&!cdir.value.trim())return err.textContent='Escribe la dirección de entrega.';
let m=`Hola ${T.nombre}, quiero hacer un pedido:\n`;for(const[i,n]of Object.entries(car)){const p=P(i);if(p)m+=`• ${n} x ${p.nombre} = ${soles(p.precio*n)}\n`}m+=`Total: ${soles(total())}\nNombre: ${cnom.value}\nEntrega: ${cent.value}`+(cdir.value?`\nDirección: ${cdir.value}`:'')+(cnot.value?`\nNota: ${cnot.value}`:'');for(const[i,n]of Object.entries(car)){const p=P(i);if(p&&n>p.stock)return err.textContent=`Stock insuficiente de ${p.nombre}.`}
const items=Object.entries(car).map(([i,n])=>{const p=P(i);return p&&{id:i,nombre:p.nombre,cant:n,precio:p.precio}}).filter(Boolean);
const dd=cargar(),TT=dd.tiendas.find(x=>x.id==T.id);items.forEach(x=>{const p=TT.productos.find(y=>y.id==x.id);if(p)p.stock=Math.max(0,p.stock-x.cant)});dd.pedidos.push({id:'o'+Date.now().toString(36),tienda:T.id,fecha:new Date().toISOString(),items,total:total(),cliente:cnom.value.trim(),entrega:cent.value,dir:cdir.value.trim(),nota:cnot.value.trim(),estado:'nuevo'});guardar(dd);
Object.assign(T,TT);car={};gc();rg();ri();cerrar();aviso('✅ Pedido enviado. Se abrirá WhatsApp.');
window.open('https://wa.me/'+String(T.wa).replace(/\D/g,'')+'?text='+encodeURIComponent(m),'_blank')}
let dp;addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;inst.classList.remove('hidden')});function instalar(){dp&&dp.prompt()}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
q.oninput=rg;ord.onchange=rg;rf();rg();if(location.hash=='#carrito')abrir()</script></body></html>
