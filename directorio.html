<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.46.0/tabler-icons.min.css"><link rel="stylesheet" href="assets/css/theme.css"><script src="assets/js/app.js"></script><title>Tiendas · RiverMarket</title></head><body class="text-gray-600"><div id="cab"></div>
<section class="container my-8"><div class="flex flex-col md:flex-row md:items-end justify-between gap-4 mb-6"><div><h1 class="text-2xl">Directorio de tiendas</h1><p>Tiendas de ejemplo para la demostración.</p></div>
<div class="relative md:w-80"><i class="ti ti-search absolute left-3 top-3"></i><input id="q" placeholder="Buscar tienda o rubro" class="border border-gray-300 rounded-lg w-full p-2 pl-9"></div></div>
<div id="l" class="grid gap-5 sm:grid-cols-2 lg:grid-cols-3"></div></section><div id="pie"></div>
<script>montar('dir');const d=cargar();function r(){const t=q.value.toLowerCase();l.innerHTML=d.tiendas.filter(x=>(x.nombre+x.rubro).toLowerCase().includes(t)).map(x=>{const a=x.productos.filter(p=>p.activo);return `<a href="tienda.html?t=${x.id}" class="group rounded-lg border border-gray-300 overflow-hidden bg-white hover:shadow-lg transition"><div class="h-32 relative overflow-hidden" style="background:${x.color}">${x.banner?`<img src="${src(x.banner)}" class="w-full h-full object-cover opacity-80 group-hover:scale-105 transition">`:''}</div>
<div class="p-4 -mt-10 relative">${logoHTML(x,"w-16 h-16 rounded-xl border-4 border-white shadow","text-[30px]")}<h3 class="text-md mt-2">${esc(x.nombre)}</h3>${x.bienvenida?`<p class="text-sm italic" style="color:${x.color}">${esc(x.bienvenida)}</p>`:''}<p class="text-sm">${esc(x.rubro)} · ${a.length} productos</p>
<div class="flex gap-2 mt-3">${a.slice(0,4).map(p=>`<img src="${esc(p.img)}" class="w-12 h-12 rounded-lg object-cover border border-gray-200">`).join('')}</div><div class="mt-3 font-semibold" style="color:${x.color}">Visitar tienda <i class="ti ti-arrow-right"></i></div></div></a>`}).join('')||'<p>No se encontraron tiendas.</p>'}q.oninput=r;r()</script></body></html>
