<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.46.0/tabler-icons.min.css"><link rel="stylesheet" href="assets/css/theme.css"><link rel="manifest" id="mf" href="manifest.webmanifest"><meta name="theme-color" content="#0aad0a"><link rel="icon" href="assets/images/icono-192.png"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script><script src="assets/js/rm.js"></script><title>Tiendas · RiverMarket</title></head><body class="text-gray-600"><div id="cab"></div>
<section class="container my-8"><h1 class="text-2xl mb-1">Tiendas</h1><p class="mb-5">Elige tu ciudad y te mostramos solo las tiendas que envían hasta ti.</p>
<div class="grid gap-3 md:grid-cols-4 mb-6"><div class="relative md:col-span-2"><i class="ti ti-search absolute left-3 top-3"></i><input id="q" placeholder="Buscar tienda, rubro o producto" class="border border-gray-300 rounded-lg w-full p-2 pl-9"></div>
<select id="fc" class="border border-gray-300 rounded-lg p-2"><option value="">Estoy en… (todas)</option></select><select id="fr" class="border border-gray-300 rounded-lg p-2"><option value="">Todos los rubros</option></select></div>
<div class="flex flex-wrap gap-4 mb-4 text-sm"><label class="inline-flex items-center gap-2"><input type="checkbox" id="fv" class="rounded text-green-600"> Solo verificadas</label><label class="inline-flex items-center gap-2"><input type="checkbox" id="fp" class="rounded text-green-600"> Envíos a todo el Perú</label><span id="res" class="ml-auto"></span></div>
<div id="l" class="grid gap-5 sm:grid-cols-2 lg:grid-cols-3"></div></section><div id="pie"></div>
<script>montar('dir');const U=new URLSearchParams(location.search);fc.innerHTML+=CIUDADES.map(c=>`<option>${c}</option>`).join('');fr.innerHTML+=RUBROS.map(c=>`<option>${c}</option>`).join('');
q.value=U.get('q')||'';fc.value=U.get('ciudad')||localStorage.getItem('rm_ciudad')||'';let T=[],V={},PR={};
(async()=>{const [{data:t},{data:r},{data:p}]=await Promise.all([sb.from('tiendas').select('id,slug,nombre,rubro,descripcion,ciudad,distrito,zona_tipo,zona_distritos,portada,logo,color,icono,verificada,destacada,bienvenida').order('destacada',{ascending:false}).order('creado'),sb.from('resenas').select('tienda_id,estrellas'),sb.from('productos').select('tienda_id,nombre,fotos').limit(1000)]);
T=t||[];(r||[]).forEach(x=>{V[x.tienda_id]=V[x.tienda_id]||{s:0,n:0};V[x.tienda_id].s+=x.estrellas;V[x.tienda_id].n++});(p||[]).forEach(x=>{(PR[x.tienda_id]=PR[x.tienda_id]||[]).push(x)});pintar()})();
function pintar(){localStorage.setItem('rm_ciudad',fc.value);const s=q.value.toLowerCase().trim();
const arr=T.filter(t=>enviaA(t,fc.value)&&(!fr.value||t.rubro==fr.value)&&(!fv.checked||t.verificada)&&(!fp.checked||t.zona_tipo=='peru')&&(!s||(t.nombre+' '+t.rubro+' '+t.descripcion+' '+(PR[t.id]||[]).map(x=>x.nombre).join(' ')).toLowerCase().includes(s)));
res.textContent=arr.length+' tiendas';
l.innerHTML=arr.map(x=>{const v=V[x.id],ps=(PR[x.id]||[]).slice(0,4);return `<a href="tienda.html?t=${x.slug}" class="group rounded-lg border border-gray-300 overflow-hidden bg-white hover:shadow-lg transition"><div class="h-32 relative overflow-hidden" style="background:${esc(x.color)}">${x.portada?`<img src="${esc(x.portada)}" class="w-full h-full object-cover opacity-90 group-hover:scale-105 transition">`:''}${x.destacada?'<span class="absolute top-2 right-2 bg-yellow-400 text-gray-900 text-sm font-semibold rounded px-2">Destacada</span>':''}</div>
<div class="p-4 -mt-10 relative">${logoHTML(x,'w-16 h-16 rounded-xl border-4 border-white shadow','text-[30px]')}<h3 class="text-md mt-2">${esc(x.nombre)}</h3><p class="text-sm">${esc(x.rubro)} · ${esc(x.ciudad)} ${v?' · '+estrellas(v.s/v.n)+' ('+v.n+')':''}</p>
<div class="flex flex-wrap gap-1 my-2">${x.verificada?BADGE_VERIF:''}${x.zona_tipo=='peru'?BADGE_PERU:`<span class="text-sm text-gray-500"><i class="ti ti-truck"></i> ${esc(envioTexto(x))}</span>`}</div>
<div class="flex gap-2 mt-2">${ps.map(p=>`<img src="${esc(src(p.fotos[0]))}" class="w-12 h-12 rounded-lg object-cover border border-gray-200">`).join('')}</div><div class="mt-3 font-semibold" style="color:${esc(x.color)}">Visitar tienda <i class="ti ti-arrow-right"></i></div></div></a>`}).join('')||'<p class="col-span-full">No hay tiendas que envíen a esa ciudad con esos filtros. Prueba con "Envíos a todo el Perú".</p>'}
[q,fc,fr,fv,fp].forEach(e=>e.addEventListener(e.tagName=='INPUT'&&e.type=='text'?'input':'change',pintar));q.oninput=pintar;
</script></body></html>
