<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.46.0/tabler-icons.min.css"><link rel="stylesheet" href="assets/css/theme.css"><link rel="manifest" id="mf" href="manifest.webmanifest"><meta name="theme-color" content="#0aad0a"><link rel="icon" href="assets/images/icono-192.png"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script><script src="assets/js/rm.js"></script><title>Administración · RiverMarket</title></head><body class="text-gray-600"><div id="cab"></div>
<section class="container my-6"><div id="cargando" class="py-16 text-center">Cargando…</div><div id="pn" class="hidden">
<div class="flex flex-wrap justify-between items-center gap-3 mb-4"><div><div class="text-sm">RiverMarket</div><h1 class="text-xl">Administración</h1></div><button class="${BTNO} btn-sm" onclick="sb.auth.signOut().then(()=>location.href='index.html')">Salir</button></div>
<div class="grid grid-cols-2 md:grid-cols-5 gap-3 mb-4" id="kp"></div><div class="flex border-b border-gray-300 mb-5 overflow-x-auto" id="tabs"></div>
<div id="a0" class="tab"><div class="flex flex-wrap gap-2 mb-4"><input id="qt" placeholder="Buscar tienda" class="border border-gray-300 rounded-lg p-2 flex-1"><select id="fe" class="border border-gray-300 rounded-lg p-2"><option value="">Todas</option><option value="revision">En revisión</option><option value="activa">Activas</option><option value="suspendida">Suspendidas</option></select></div><div id="lt" class="grid gap-3"></div></div>
<div id="a1" class="tab hidden"><div class="grid lg:grid-cols-3 gap-5"><form id="fpg" class="border border-gray-300 rounded-lg p-5 self-start"><h3 class="text-md mb-3">Registrar pago</h3>
<label class="${LBL}">Tienda</label><select name="tienda_id" id="pgt" class="${INP}"></select><label class="${LBL}">Concepto</label><select name="concepto" id="pgc" class="${INP}"><option data-m="19" data-p="basico">Plan Básico (S/ 19)</option><option data-m="39" data-p="pro">Plan Pro (S/ 39)</option><option data-m="15" data-p="destacado">Destacado (+S/ 15)</option><option data-m="" data-p="">Otro</option></select>
<div class="grid grid-cols-2 gap-3"><div><label class="${LBL}">Monto S/</label><input name="monto" id="pgm" value="19" inputmode="decimal" class="${INP}"></div><div><label class="${LBL}">Método</label><select name="metodo" class="${INP}"><option>Yape</option><option>Plin</option><option>Transferencia</option><option>Efectivo</option></select></div></div>
<label class="${LBL}">Válido hasta</label><input name="periodo_hasta" type="date" id="pgh" class="${INP}"><label class="${LBL}">Nota</label><input name="nota" class="${INP}"><button class="${BTN} w-full">Guardar pago</button></form>
<div class="lg:col-span-2"><div id="pgr" class="grid grid-cols-3 gap-3 mb-4"></div><div id="pgl" class="border border-gray-300 rounded-lg p-4 overflow-x-auto"></div></div></div></div>
<div id="a2" class="tab hidden"><div class="grid lg:grid-cols-3 gap-5"><form id="fan" class="border border-gray-300 rounded-lg p-5 self-start"><h3 class="text-md mb-3">Nuevo aviso a tiendas</h3><label class="${LBL}">Para</label><select name="tienda_id" id="ant" class="${INP}"></select><label class="${LBL}">Título</label><input name="titulo" required maxlength="80" class="${INP}"><label class="${LBL}">Mensaje</label><textarea name="mensaje" required rows="4" maxlength="1000" class="${INP}"></textarea><button class="${BTN} w-full">Publicar en el panel</button><p class="text-sm mt-2">Luego puedes enviarlo también por WhatsApp con los enlaces preparados.</p></form><div class="lg:col-span-2 grid gap-3 self-start" id="anl"></div></div></div>
<div id="a3" class="tab hidden"><div class="grid lg:grid-cols-3 gap-5"><form id="fca" class="border border-gray-300 rounded-lg p-5 self-start"><h3 class="text-md mb-3">Nueva campaña</h3><label class="${LBL}">Título</label><input name="titulo" required class="${INP}"><label class="${LBL}">Descripción</label><input name="descripcion" class="${INP}"><div class="grid grid-cols-3 gap-2"><div><label class="${LBL}">Desc. %</label><input name="descuento" type="number" min="0" max="90" class="${INP}"></div><div><label class="${LBL}">Inicio</label><input name="inicio" type="date" class="${INP}"></div><div><label class="${LBL}">Fin</label><input name="fin" type="date" class="${INP}"></div></div><button class="${BTN} w-full">Crear campaña</button></form><div class="lg:col-span-2 grid gap-3 self-start" id="cal"></div></div></div>
<div id="a4" class="tab hidden"><form id="fme" class="border border-gray-300 rounded-lg p-5 max-w-2xl" onsubmit="return false"><h3 class="text-md mb-3">Portada del market</h3><label class="${LBL}">Título</label><input id="mt" class="${INP}"><label class="${LBL}">Subtítulo</label><input id="ms" class="${INP}">
<div id="mip" class="h-36 rounded-lg overflow-hidden bg-gray-100 mb-2"></div><label class="${BTNO} btn-sm cursor-pointer mb-4"><i class="ti ti-photo"></i> Cambiar imagen<input type="file" accept="image/*" id="mif" class="hidden"></label>
<h3 class="text-md mb-2 mt-4">Banner superior</h3><label class="${LBL}">Texto</label><input id="bt" class="${INP}"><label class="${LBL}">Enlace (opcional)</label><input id="be" class="${INP}" placeholder="registro.html"><button type="button" class="${BTN}" onclick="guardarMercado()">Guardar</button> <span id="mm" class="text-sm"></span>
<p class="text-sm mt-4">Las tiendas destacadas se marcan en la pestaña Tiendas (botón ★).</p></form></div>
<div id="a5" class="tab hidden"><div id="lel" class="border border-gray-300 rounded-lg p-4 overflow-x-auto"></div></div>
</div></section>
<div id="md" class="fixed inset-0 z-50 bg-black/50 hidden overflow-y-auto"><div class="bg-white rounded-2xl max-w-3xl mx-auto my-6 p-5 md:p-6 relative"><button class="absolute right-4 top-4 text-xl" onclick="md.classList.add('hidden')"><i class="ti ti-x"></i></button><div id="mdc"></div></div></div>
<div id="pie"></div>
<script>fixClases();let TS=[],VE=[],PG=[],MI={};const f=d=>d?new Date((d.length==10?d+'T12:00':d)).toLocaleDateString('es-PE'):'—';
(async()=>{const s=await montar('');if(!s){location.href='ingresar.html';return}const pf=await perfil();if(!pf||pf.rol!='admin'){cargando.innerHTML='<h1 class="text-xl">Acceso solo para administradores</h1>';return}
tabs.innerHTML=['Tiendas','Planes y pagos','Avisos','Campañas','Portada y banners','Solicitudes'].map((x,i)=>`<button class="px-4 py-2 font-semibold border-b-2 whitespace-nowrap" onclick="tab(${i})">${x}</button>`).join('');cargando.remove();pn.classList.remove('hidden');await cargar();tab(0)})();
async function cargar(){const [{data:t},{data:v},{data:p}]=await Promise.all([sb.from('tiendas').select('*').order('creado',{ascending:false}),sb.from('verificaciones').select('*').order('creado',{ascending:false}),sb.from('pagos').select('*').order('creado',{ascending:false})]);TS=t||[];VE=v||[];PG=p||[];
const mes=new Date().toISOString().slice(0,7);kp.innerHTML=[['Tiendas',TS.filter(x=>!x.demo).length],['En revisión',TS.filter(x=>x.estado=='revision').length],['Activas',TS.filter(x=>x.estado=='activa').length],['Verificadas',TS.filter(x=>x.verificada).length],['Cobrado este mes',soles(PG.filter(x=>x.creado.slice(0,7)==mes).reduce((s,x)=>s+(+x.monto),0))]].map(([a,b])=>`<div class="rounded-lg bg-gray-100 p-4"><div class="text-xl font-bold text-gray-800">${b}</div><div class="text-sm">${a}</div></div>`).join('');
const op=TS.map(x=>`<option value="${x.id}">${esc(x.nombre)}</option>`).join('');pgt.innerHTML=op;ant.innerHTML='<option value="">Todas las tiendas</option>'+op}
function tab(i){[...tabs.children].forEach((b,j)=>b.className='px-4 py-2 font-semibold border-b-2 whitespace-nowrap '+(i==j?'border-green-600 text-green-600':'border-transparent'));document.querySelectorAll('.tab').forEach((e,j)=>e.classList.toggle('hidden',i!=j));[lista,pagos,anuncios,campanas,mercado,leads][i]()}
const BE={activa:'bg-green-100 text-green-800',revision:'bg-yellow-100 text-yellow-800',suspendida:'bg-red-100 text-red-700'};
function lista(){const q=qt.value.toLowerCase();lt.innerHTML=TS.filter(t=>(!fe.value||t.estado==fe.value)&&(t.nombre+t.slug+t.ciudad).toLowerCase().includes(q)).map(t=>{const v=VE.find(x=>x.tienda_id==t.id);return `<div class="border border-gray-300 rounded-lg p-3 bg-white"><div class="flex flex-wrap items-center gap-3">${logoHTML(t,'w-12 h-12 rounded-lg','text-2xl')}<div class="flex-1 min-w-[180px]"><div class="font-semibold text-gray-800">${esc(t.nombre)} ${t.demo?'<span class="text-sm text-gray-400">(ejemplo)</span>':''}</div><div class="text-sm">${esc(t.rubro)} · ${esc(t.ciudad)} · <a class="text-green-700" target="_blank" href="tienda.html?t=${t.slug}">/${t.slug}</a></div>
<div class="flex flex-wrap gap-1 mt-1 text-sm"><span class="rounded px-2 ${BE[t.estado]}">${t.estado}</span>${t.verificada?'<span class="rounded px-2 bg-blue-100 text-blue-800">verificada</span>':''}${t.destacada?'<span class="rounded px-2 bg-yellow-300 text-gray-900">destacada</span>':''}<span class="rounded px-2 bg-gray-100">${t.plan}${t.extra_destacado?' + destacado':''}</span><span class="rounded px-2 bg-gray-100">prueba ${f(t.prueba_hasta)} · pagado ${f(t.pagado_hasta)}</span>${v?`<span class="rounded px-2 ${v.estado=='aprobada'?'bg-green-50 text-green-700':'bg-yellow-50 text-yellow-800'}">verificación ${v.estado} (${v.puntaje}/100)</span>`:''}</div></div>
<div class="flex flex-wrap gap-1">${v?`<button class="${BTNO} btn-sm" onclick="docs('${t.id}')"><i class="ti ti-id"></i> Documentos</button>`:''}${t.estado!='activa'?`<button class="${BTN} btn-sm" onclick="upd('${t.id}',{estado:'activa'})">${t.estado=='suspendida'?'Reactivar':'Aprobar'}</button>`:`<button class="${BTNR} btn-sm" onclick="if(confirm('¿Suspender esta tienda?'))upd('${t.id}',{estado:'suspendida'})">Suspender</button>`}
<button class="${BTNO} btn-sm" onclick="upd('${t.id}',{verificada:${!t.verificada}})">${t.verificada?'Quitar verificación':'Verificar'}</button><button class="${BTNO} btn-sm" title="Destacar" onclick="upd('${t.id}',{destacada:${!t.destacada}})">${t.destacada?'★ Quitar':'☆ Destacar'}</button>
<select class="border border-gray-300 rounded-lg p-1 text-sm" onchange="upd('${t.id}',{plan:this.value})">${['prueba','basico','pro'].map(p=>`<option ${p==t.plan?'selected':''} value="${p}">${PLANES[p]}</option>`).join('')}</select><a class="${WAC} btn-sm" target="_blank" href="https://wa.me/${t.wa}"><i class="ti ti-brand-whatsapp"></i></a></div></div></div>`}).join('')||'<p>Sin resultados.</p>'}
qt.oninput=lista;fe.onchange=lista;
async function upd(id,v){const {error}=await sb.from('tiendas').update(v).eq('id',id);if(error)return aviso(errTxt(error));await cargar();lista()}
async function docs(tid){const v=VE.find(x=>x.tienda_id==tid),t=TS.find(x=>x.id==tid);mdc.innerHTML='Cargando documentos…';md.classList.remove('hidden');
const urls=await Promise.all([v.dni_frente,v.dni_reverso,v.selfie].map(async p=>{if(!p)return null;const {data}=await sb.storage.from('dni').createSignedUrl(p,300);return data&&data.signedUrl}));const c=v.checks||{};
const ck=[['DNI frontal nítido',c.dni_nitido],['DNI posterior nítido',c.reverso_nitido],['Rostro en DNI',c.rostro_dni],['Prueba de vida',c.vida],['Rostro coincide'+(c.distancia!=null?' (distancia '+c.distancia+')':''),c.rostro_coincide]];
mdc.innerHTML=`<h3 class="text-lg mb-1">${esc(t.nombre)}</h3><p class="mb-3">DNI <b>${esc(v.dni)}</b> · ${esc(t.direccion)}, ${esc(t.distrito)}, ${esc(t.ciudad)} · RUC ${esc(t.ruc||'—')} · Privacidad aceptada ${f(v.acepto_privacidad)} · Puntaje ${v.puntaje}/100</p>
<ul class="grid md:grid-cols-2 gap-1 mb-4">${ck.map(([a,b])=>`<li>${b?'<i class="ti ti-circle-check text-green-600"></i>':'<i class="ti ti-alert-triangle text-yellow-600"></i>'} ${a}</li>`).join('')}</ul>
<div class="grid md:grid-cols-3 gap-3 mb-4">${['DNI frontal','DNI posterior','Selfie (prueba de vida)'].map((n,i)=>`<div><div class="text-sm font-semibold mb-1">${n}</div>${urls[i]?`<a href="${urls[i]}" target="_blank"><img src="${urls[i]}" class="w-full rounded-lg border border-gray-200"></a>`:'<div class="p-4 bg-gray-100 rounded-lg text-sm">Sin imagen</div>'}</div>`).join('')}</div>
<p class="text-sm mb-3">Los enlaces a los documentos caducan en 5 minutos (almacenamiento privado).</p><label class="${LBL}">Nota interna</label><input id="nadm" value="${esc(v.nota_admin||'')}" class="${INP}">
<div class="flex flex-wrap gap-2"><button class="${BTN}" onclick="decidir('${v.id}','${tid}','aprobada')"><i class="ti ti-check"></i> Aprobar y verificar</button><button class="${BTNR}" onclick="decidir('${v.id}','${tid}','rechazada')"><i class="ti ti-x"></i> Rechazar y suspender</button><button class="${BTNO}" onclick="decidir('${v.id}','${tid}','revision')">Dejar en revisión</button></div>`}
async function decidir(vid,tid,e){await sb.from('verificaciones').update({estado:e,nota_admin:nadm.value}).eq('id',vid);if(e=='aprobada')await sb.from('tiendas').update({estado:'activa',verificada:true}).eq('id',tid);if(e=='rechazada')await sb.from('tiendas').update({estado:'suspendida',verificada:false}).eq('id',tid);md.classList.add('hidden');aviso('Guardado');await cargar();lista()}
/* Pagos */
function pagos(){const d=new Date();d.setMonth(d.getMonth()+1);if(!pgh.value)pgh.value=d.toISOString().slice(0,10);const mes=new Date().toISOString().slice(0,7);const nm=n=>(TS.find(t=>t.id==n)||{}).nombre||'—';
const pag=TS.filter(t=>!t.demo&&t.plan!='prueba').length,ven=TS.filter(t=>!t.demo&&((t.pagado_hasta&&t.pagado_hasta<new Date().toISOString().slice(0,10))||(t.plan=='prueba'&&t.prueba_hasta&&t.prueba_hasta<new Date().toISOString().slice(0,10)))).length;
pgr.innerHTML=[['Cobrado este mes',soles(PG.filter(x=>x.creado.slice(0,7)==mes).reduce((s,x)=>s+(+x.monto),0))],['Tiendas con plan pagado',pag],['Vencidas (prueba o pago)',ven]].map(([a,b])=>`<div class="rounded-lg bg-green-50 border border-green-200 p-4"><div class="text-xl font-bold text-gray-800">${b}</div><div class="text-sm">${a}</div></div>`).join('');
pgl.innerHTML='<table class="w-full text-sm text-left"><tr class="text-gray-800"><th class="p-2">Fecha</th><th class="p-2">Tienda</th><th class="p-2">Concepto</th><th class="p-2">Monto</th><th class="p-2">Método</th><th class="p-2">Hasta</th></tr>'+PG.map(p=>`<tr class="border-t border-gray-200"><td class="p-2">${f(p.creado)}</td><td class="p-2">${esc(nm(p.tienda_id))}</td><td class="p-2">${esc(p.concepto)}</td><td class="p-2">${soles(p.monto)}</td><td class="p-2">${esc(p.metodo)}</td><td class="p-2">${f(p.periodo_hasta)}</td></tr>`).join('')+'</table>'+(PG.length?'':'<p class="p-2">Sin pagos registrados.</p>')}
pgc.onchange=()=>{const o=pgc.selectedOptions[0];if(o.dataset.m)pgm.value=o.dataset.m};
fpg.onsubmit=async e=>{e.preventDefault();const v=Object.fromEntries(new FormData(fpg)),o=pgc.selectedOptions[0].dataset.p,m=precioValido(v.monto);if(m===null)return aviso('Monto no válido');v.monto=m;v.periodo_hasta=v.periodo_hasta||null;
const {error}=await sb.from('pagos').insert(v);if(error)return aviso(errTxt(error));const u={pagado_hasta:v.periodo_hasta};if(o=='basico'||o=='pro')u.plan=o;if(o=='destacado'){u.extra_destacado=true;u.destacada=true}await sb.from('tiendas').update(u).eq('id',v.tienda_id);aviso('Pago registrado');fpg.nota.value='';await cargar();pagos()};
/* Avisos */
async function anuncios(){const {data}=await sb.from('anuncios').select('*').order('creado',{ascending:false});anl.innerHTML=(data||[]).map(a=>{const ds=a.tienda_id?TS.filter(t=>t.id==a.tienda_id):TS.filter(t=>!t.demo);const txt=encodeURIComponent('RiverMarket · '+a.titulo+'\n'+a.mensaje);
return `<div class="border border-gray-300 rounded-lg p-4"><div class="flex justify-between gap-2"><b class="text-gray-800">${esc(a.titulo)}</b><span class="text-sm">${f(a.creado)} · ${a.tienda_id?esc((TS.find(t=>t.id==a.tienda_id)||{}).nombre):'Todas'}</span></div><p class="whitespace-pre-line my-1">${esc(a.mensaje)}</p>
<details class="text-sm"><summary class="cursor-pointer text-green-700">Enviar por WhatsApp (${ds.length})</summary><div class="flex flex-wrap gap-2 mt-2">${ds.map(t=>`<a target="_blank" class="${WAC} btn-sm" href="https://wa.me/${t.wa}?text=${txt}">${esc(t.nombre)}</a>`).join('')||'Sin tiendas'}</div></details>
<button class="text-sm text-red-600 mt-2" onclick="sb.from('anuncios').delete().eq('id','${a.id}').then(anuncios)">Borrar</button></div>`}).join('')||'<p>Sin avisos.</p>'}
fan.onsubmit=async e=>{e.preventDefault();const v=Object.fromEntries(new FormData(fan));v.tienda_id=v.tienda_id||null;const {error}=await sb.from('anuncios').insert(v);if(error)return aviso(errTxt(error));fan.reset();aviso('Aviso publicado');anuncios()};
/* Campañas */
async function campanas(){const {data}=await sb.from('campanas').select('*').order('creado',{ascending:false});cal.innerHTML=(data||[]).map(c=>`<div class="border border-gray-300 rounded-lg p-4 flex flex-wrap justify-between gap-2"><div><b class="text-gray-800">${esc(c.titulo)}</b>${c.descuento?' · -'+c.descuento+'%':''}<div class="text-sm">${esc(c.descripcion)} · ${f(c.inicio)} – ${f(c.fin)}</div></div><div class="flex gap-2"><button class="${BTNO} btn-sm" onclick="sb.from('campanas').update({activa:${!c.activa}}).eq('id','${c.id}').then(campanas)">${c.activa?'Desactivar':'Activar'}</button><button class="${BTNR} btn-sm" onclick="sb.from('campanas').delete().eq('id','${c.id}').then(campanas)">Borrar</button></div></div>`).join('')||'<p>Sin campañas.</p>'}
fca.onsubmit=async e=>{e.preventDefault();const v=Object.fromEntries(new FormData(fca));['descuento','inicio','fin'].forEach(k=>v[k]=v[k]||null);const {error}=await sb.from('campanas').insert(v);if(error)return aviso(errTxt(error));fca.reset();campanas()};
/* Portada */
async function mercado(){const {data}=await sb.from('mercado').select('*');(data||[]).forEach(r=>MI[r.clave]=r.valor);const p=MI.portada||{},b=(MI.banners||[])[0]||{};mt.value=p.titulo||'';ms.value=p.subtitulo||'';mip.innerHTML=p.imagen?`<img src="${esc(p.imagen)}" class="w-full h-full object-cover">`:'';bt.value=b.texto||'';be.value=b.enlace||''}
mif.onchange=async()=>{const fl=mif.files[0];if(!fl)return;try{const u=await subirPublico(await comprimir(fl,1600,.8),'mercado');MI.portada={...(MI.portada||{}),imagen:u};mip.innerHTML=`<img src="${esc(u)}" class="w-full h-full object-cover">`}catch(e){aviso(errTxt(e))}};
async function guardarMercado(){const p={...(MI.portada||{}),titulo:mt.value,subtitulo:ms.value};const {error}=await sb.from('mercado').upsert([{clave:'portada',valor:p},{clave:'banners',valor:bt.value?[{texto:bt.value,enlace:be.value}]:[]}]);mm.textContent=error?errTxt(error):'✅ Guardado'}
/* Leads */
async function leads(){const {data}=await sb.from('leads').select('*').order('creado',{ascending:false});lel.innerHTML='<table class="w-full text-sm text-left"><tr class="text-gray-800"><th class="p-2">Fecha</th><th class="p-2">Negocio</th><th class="p-2">Contacto</th><th class="p-2">Rubro</th><th class="p-2">Ciudad</th><th></th></tr>'+(data||[]).map(l=>`<tr class="border-t border-gray-200"><td class="p-2">${f(l.creado)}</td><td class="p-2"><b>${esc(l.negocio)}</b></td><td class="p-2">${esc(l.nombre)}<br>${esc(l.wa)}</td><td class="p-2">${esc(l.rubro)}</td><td class="p-2">${esc(l.ciudad)}</td><td class="p-2"><a target="_blank" class="text-green-700" href="https://wa.me/${String(l.wa).replace(/\D/g,'').replace(/^9/,'519')}?text=${encodeURIComponent('Hola '+l.nombre+', te escribimos de RiverMarket por tu solicitud para '+l.negocio+'.')}"><i class="ti ti-brand-whatsapp"></i> Escribir</a></td></tr>`).join('')+'</table>'+((data||[]).length?'':'<p class="p-2">Sin solicitudes.</p>')}
</script></body></html>
