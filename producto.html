<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.46.0/tabler-icons.min.css"><link rel="stylesheet" href="assets/css/theme.css"><link rel="manifest" id="mf" href="manifest.webmanifest"><meta name="theme-color" content="#0aad0a"><link rel="icon" href="assets/images/icono-192.png"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script><script src="assets/js/rm.js"></script><script src="assets/js/carrito.js"></script><title>Producto · RiverMarket</title></head><body class="text-gray-600 pb-20"><div id="cab"></div>
<section class="container my-6" id="main"><p>Cargando…</p></section>
<section class="container my-8" id="secRes"></section>
<button onclick="abrir()" id="fab" class="fixed bottom-4 right-4 z-30 ${BTN} tb shadow-lg !rounded-full !px-5 !py-3 hidden"><i class="ti ti-shopping-cart text-lg"></i> <span id="cn">0</span> · <span id="tt">S/ 0.00</span></button>
<div id="pie"></div>
<script>fixClases();montar('');let T,PR,PS=[];const P=i=>PS.find(x=>x.id==i);let est=5;
(async()=>{const id=new URLSearchParams(location.search).get('id');const {data:p}=await sb.from('productos').select('*,tiendas(*)').eq('id',id).maybeSingle();
if(!p){main.innerHTML='<div class="text-center my-16"><h1 class="text-xl">Producto no disponible</h1><a class="text-green-600" href="directorio.html">Ver tiendas</a></div>';return}
PR=p;T=p.tiendas;PS=[p];document.title=p.nombre+' · '+T.nombre;const col=T.color||'#0aad0a';
document.head.insertAdjacentHTML('beforeend',`<style>.tb{background:${col}!important;border-color:${col}!important;color:#fff!important}</style>`);
const fotos=p.fotos.length?p.fotos:[src('')],d=descuento(p);
main.innerHTML=`<nav class="text-sm mb-4"><a href="tienda.html?t=${T.slug}" class="hover:text-green-600">${esc(T.nombre)}</a> › <span>${esc(p.categoria)}</span></nav>
<div class="grid md:grid-cols-2 gap-8"><div><div class="relative rounded-2xl overflow-hidden bg-gray-100 aspect-square">${d?`<span class="absolute top-3 left-3 z-10 bg-red-600 text-white font-bold rounded px-2 py-1">-${d}%</span>`:''}<img id="gim" src="${esc(fotos[0])}" class="w-full h-full object-contain bg-white"></div>
<div class="flex gap-2 mt-3 overflow-x-auto">${fotos.map((f,i)=>`<button onclick="gim.src='${esc(f)}';document.querySelectorAll('.th').forEach(x=>x.classList.remove('ring-2'));this.classList.add('ring-2')" class="th flex-none w-20 h-20 rounded-lg overflow-hidden border border-gray-200 ring-green-600 ${i?'':'ring-2'}"><img src="${esc(f)}" class="w-full h-full object-cover"></button>`).join('')}</div></div>
<div><span class="text-sm text-gray-500">${esc(p.categoria)}</span><h1 class="text-2xl md:text-3xl my-1">${esc(p.nombre)}</h1><div id="pst" class="mb-3"></div>
<div class="flex items-end gap-3 mb-2"><span class="text-2xl font-bold text-gray-900">${soles(p.precio)}</span>${d?`<s class="text-md text-gray-500">${soles(p.precio_antes)}</s><span class="text-red-600 font-semibold">Ahorras ${soles(p.precio_antes-p.precio)}</span>`:''}</div>
<p class="mb-4 ${p.stock<=0?'text-red-600 font-semibold':p.stock<=3?'text-yellow-700 font-semibold':''}">${p.stock<=0?'Agotado':p.stock<=3?'¡Quedan '+p.stock+' unidades!':'Disponible ('+p.stock+' en stock)'}</p>
<button ${p.stock<=0?'disabled':''} onclick="add('${p.id}',1)" class="${BTN} tb w-full md:w-auto !px-8"><i class="ti ti-shopping-cart-plus"></i> Agregar al carrito</button>
${p.descripcion?`<h3 class="text-md mt-6 mb-2">Descripción</h3><p class="whitespace-pre-line">${esc(p.descripcion)}</p>`:''}
${p.caracteristicas&&p.caracteristicas.length?`<h3 class="text-md mt-6 mb-2">Características</h3><ul class="space-y-1">${p.caracteristicas.map(c=>`<li class="flex gap-2"><i class="ti ti-check text-green-600 mt-1"></i>${esc(c)}</li>`).join('')}</ul>`:''}
<a href="tienda.html?t=${T.slug}" class="flex items-center gap-3 mt-6 p-3 rounded-lg border border-gray-300 hover:shadow">${logoHTML(T,'w-12 h-12 rounded-lg','text-2xl')}<div class="flex-1"><div class="font-semibold text-gray-800">${esc(T.nombre)}</div><div class="flex flex-wrap gap-1 mt-1">${T.verificada?BADGE_VERIF:''}${T.zona_tipo=='peru'?BADGE_PERU:`<span class="text-sm"><i class="ti ti-truck"></i> ${esc(envioTexto(T))}</span>`}</div></div><i class="ti ti-chevron-right"></i></a></div></div>`;
fab.classList.remove('hidden');initCheckout(T,P);window.rc=()=>{const car=carLeer(T.id);cn.textContent=Object.values(car).reduce((a,b)=>a+b,0);tt.textContent=soles(Object.entries(car).reduce((s,[i,n])=>s+(i==p.id?p.precio*n:0),0))};
// otros productos del carrito de esta tienda: cargar para el total correcto
const ids=Object.keys(carLeer(T.id)).filter(i=>i!=p.id);if(ids.length){const {data:o}=await sb.from('productos').select('*').in('id',ids);PS=PS.concat(o||[])}
window.rc=()=>{const car=carLeer(T.id);cn.textContent=Object.entries(car).reduce((a,[i,n])=>a+(P(i)?n:0),0);tt.textContent=soles(total())};rc();resenas()})();
async function resenas(){const {data:r}=await sb.from('resenas').select('*').eq('producto_id',PR.id).order('creado',{ascending:false});const n=(r||[]).length,avg=n?r.reduce((s,x)=>s+x.estrellas,0)/n:0;
pst.innerHTML=n?`${estrellas(avg)} <span class="text-sm">${avg.toFixed(1)} · ${n} reseña${n>1?'s':''}</span>`:'<span class="text-sm text-gray-500">Sin reseñas todavía</span>';
secRes.innerHTML=`<div class="grid lg:grid-cols-3 gap-6"><div class="lg:col-span-2"><h2 class="text-lg mb-4">Reseñas de clientes</h2>${n?r.map(x=>`<div class="border-b border-gray-200 py-4"><div class="flex justify-between"><b class="text-gray-800">${esc(x.nombre)}</b><span class="text-sm">${new Date(x.creado).toLocaleDateString('es-PE')}</span></div>${estrellas(x.estrellas)}<span class="ml-2 text-sm text-green-700"><i class="ti ti-circle-check"></i> Compra verificada</span><p class="mt-1">${esc(x.comentario)}</p></div>`).join(''):'<p>Aún no hay reseñas. ¡Sé el primero!</p>'}</div>
<form id="fr" class="border border-gray-300 rounded-lg p-5 self-start"><h3 class="text-md mb-1">Deja tu reseña</h3><p class="text-sm mb-3">Solo con el código de tu pedido (ej. RM-0001).</p>
<label class="${LBL}">Código de pedido</label><input name="codigo" required placeholder="RM-0001" value="${esc(localStorage.getItem('rm_ultimo_pedido')||'')}" class="${INP} uppercase">
<label class="${LBL}">Calificación</label><div id="sel" class="text-3xl mb-3 cursor-pointer select-none"></div>
<label class="${LBL}">Tu nombre</label><input name="nombre" maxlength="40" class="${INP}"><label class="${LBL}">Comentario</label><textarea name="comentario" rows="3" maxlength="600" class="${INP}"></textarea>
<div id="fre" class="text-sm mb-2"></div><button class="${BTN} w-full">Publicar reseña</button></form></div>`;pintaSel();
fr.onsubmit=async e=>{e.preventDefault();const v=Object.fromEntries(new FormData(fr));const {error}=await sb.rpc('crear_resena',{p_codigo:v.codigo,p_producto:PR.id,p_estrellas:est,p_comentario:v.comentario,p_nombre:v.nombre});
if(error){fre.className='text-sm mb-2 text-red-600';fre.textContent=errTxt(error);return}aviso('¡Gracias por tu reseña!');resenas()}}
function pintaSel(){sel.innerHTML=[1,2,3,4,5].map(i=>`<span onclick="est=${i};pintaSel()" class="${i<=est?'text-yellow-500':'text-gray-300'}">★</span>`).join('')}
</script></body></html>
