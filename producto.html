<!doctype html><html lang="es"><head><link rel="icon" href="img/favicon-32.png" sizes="32x32"><link rel="apple-touch-icon" href="img/apple-touch-icon.png"><meta property="og:image" content="https://market.rivergreensolutions.com/img/og-rivermarket.png"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta name="twitter:card" content="summary_large_image"><meta name="theme-color" content="#1E4FA8"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.46.0/tabler-icons.min.css"><link rel="stylesheet" href="assets/css/theme.css"><link rel="manifest" id="mf" href="manifest.webmanifest"><meta name="theme-color" content="#0aad0a"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script><script src="assets/js/rm.js"></script><script src="assets/js/carrito.js"></script><script src="assets/js/plantillas.js"></script><title>Producto · RiverMarket</title></head><body class="text-gray-600 pb-20"><div id="cab"></div>
<section id="main"><p>Cargando…</p></section>
<section class="container my-8 pl" id="secRes"></section>
<button onclick="abrir()" id="fab" class="fixed bottom-4 right-4 z-30 ${BTN} tb shadow-lg !rounded-full !px-5 !py-3 hidden"><i class="ti ti-shopping-cart text-lg"></i> <span id="cn">0</span> · <span id="tt">S/ 0.00</span></button>
<div id="pie"></div>
<script>fixClases();montar('');let T,PR,PS=[];const P=i=>PS.find(x=>x.id==i);let est=5;
(async()=>{const id=new URLSearchParams(location.search).get('id');const {data:p}=await sb.from('productos').select('*,tiendas(*)').eq('id',id).maybeSingle();
if(!p){main.innerHTML='<div class="text-center my-16"><h1 class="text-xl">Producto no disponible</h1><a class="text-green-600" href="directorio.html">Ver tiendas</a></div>';return}
PR=p;T=p.tiendas;PS=[p];document.title=p.nombre+' · '+T.nombre;const col=T.color||'#0aad0a';
document.head.insertAdjacentHTML('beforeend',`<style>.tb{background:${col}!important;border-color:${col}!important;color:#fff!important}</style>`);
const fotos=p.fotos.length?p.fotos:[src('')],d=descuento(p),I=Object.assign({},(window.RM_DEMO_INFO||{})[T.slug]||{},T.info||{});
document.head.insertAdjacentHTML('beforeend',plCSS(col)+plCSS2()+`<style>.pd{display:grid;gap:28px}@media(min-width:900px){.pd{grid-template-columns:1.1fr 1fr;gap:48px}}.pd-im{position:relative;border-radius:24px;overflow:hidden;background:#f1f5f9;aspect-ratio:1}.pd-im img{width:100%;height:100%;object-fit:cover}.pd-th{display:flex;gap:10px;margin-top:12px;overflow-x:auto}.pd-th button{flex:none;width:72px;height:72px;border-radius:14px;overflow:hidden;border:2px solid transparent;padding:0}.pd-th button.on{border-color:var(--c)}.pd-th img{width:100%;height:100%;object-fit:cover}
.pd h1{font-size:28px;font-weight:800;line-height:1.15;margin:6px 0 10px}@media(min-width:768px){.pd h1{font-size:36px}}.pd-pr{font-family:'Plus Jakarta Sans';font-size:32px;font-weight:800;color:#0f172a}.pd-ok{display:flex;gap:10px;align-items:center;font-size:14px;padding:10px 0;border-bottom:1px solid #eef2f7}.pd-ok i{color:var(--c);font-size:20px}#cab+.pl{min-height:0}</style>`);
main.className='pl';main.innerHTML=`<nav class="pt-nav"><div class="pl-w">${logoHTML(T,'lg','')}<a href="tienda.html?t=${T.slug}" style="text-decoration:none"><b>${esc(T.nombre)}</b></a><div class="pt-links"><a href="tienda.html?t=${T.slug}#productos">Productos</a><a href="tienda.html?t=${T.slug}#nosotros">Nosotros</a><a href="tienda.html?t=${T.slug}#contacto">Contacto</a></div><button class="pt-cartb" onclick="abrir()" aria-label="Carrito"><i class="ti ti-shopping-bag"></i><span id="ptn">0</span></button></div></nav>
<div class="pl-w" style="padding-top:18px;padding-bottom:30px"><p style="font-size:13px;margin-bottom:14px"><a href="tienda.html?t=${T.slug}" style="color:var(--c);font-weight:600">${esc(T.nombre)}</a> › ${esc(p.categoria)}</p>
<div class="pd"><div><div class="pd-im">${window.navBadge?navBadge(p):''}${d?`<span class="pt-off" style="font-size:14px">-${d}%</span>`:''}<img id="gim" src="${esc(fotos[0])}" alt="${esc(p.nombre)}"></div>${fotos.length>1?`<div class="pd-th">${fotos.map((f,i)=>`<button class="${i?'':'on'}" onclick="gim.src='${esc(f)}';document.querySelectorAll('.pd-th button').forEach(x=>x.classList.remove('on'));this.classList.add('on')"><img src="${esc(f)}" alt=""></button>`).join('')}</div>`:''}</div>
<div><span class="pl-eyb">${esc(p.categoria)}</span><h1>${esc(p.nombre)}</h1><div id="pst" style="margin-bottom:12px"></div>
<div style="display:flex;align-items:baseline;gap:12px;flex-wrap:wrap"><span class="pd-pr">${soles(p.precio)}</span>${d?`<s style="color:#94a3b8;font-size:18px">${soles(p.precio_antes)}</s><span class="pl-tag" style="background:#fee2e2;color:#b91c1c;margin:0">Ahorras ${soles(p.precio_antes-p.precio)}</span>`:''}</div>
<p style="margin:12px 0 18px;font-weight:600;${p.stock<=0?'color:#dc2626':p.stock<=3?'color:#b45309':'color:#16a34a'}"><i class="ti ${p.stock<=0?'ti-circle-x':p.stock<=3?'ti-flame':'ti-circle-check'}"></i> ${p.stock<=0?'Agotado':p.stock<=3?'¡Quedan pocos! Solo '+p.stock+' unidades':'Disponible'}</p>
<div style="display:flex;gap:10px;flex-wrap:wrap"><button ${p.stock<=0?'disabled':''} onclick="add('${p.id}',1)" class="pl-btn c" style="flex:1;min-width:200px"><i class="ti ti-shopping-bag-plus"></i> Agregar al carrito</button><a target="_blank" class="pl-btn wa" href="${plWA(T)}?text=${encodeURIComponent('Hola '+T.nombre+', tengo una consulta sobre: '+p.nombre)}"><i class="ti ti-brand-whatsapp"></i> Consultar</a></div>
<div style="margin-top:18px">${(I.ventajas&&I.ventajas.length?I.ventajas:[envioTexto(T),'Pago con Yape o Plin']).slice(0,3).map((v,i)=>`<div class="pd-ok"><i class="ti ${['ti-truck-delivery','ti-wallet','ti-shield-check'][i]}"></i>${esc(v)}</div>`).join('')}</div>
${p.descripcion?`<h3 style="font-size:18px;font-weight:800;margin:22px 0 6px">Descripción</h3><p style="white-space:pre-line;line-height:1.7">${esc(p.descripcion)}</p>`:''}
${p.caracteristicas&&p.caracteristicas.length?`<h3 style="font-size:18px;font-weight:800;margin:22px 0 6px">Características</h3><ul class="pl-ul">${p.caracteristicas.map(c=>`<li><i class="ti ti-check pl-ok"></i>${esc(c)}</li>`).join('')}</ul>`:''}
<a href="tienda.html?t=${T.slug}" class="pl-box" style="display:flex;align-items:center;gap:12px;margin-top:22px;text-decoration:none;padding:14px">${logoHTML(T,'pl-logo','')}<div style="flex:1"><b style="color:#0f172a">${esc(T.nombre)}</b><div style="font-size:13px">${T.verificada?'<span style="color:#1d4ed8;font-weight:600"><i class="ti ti-rosette-discount-check"></i> Tienda verificada</span> · ':''}${esc(T.ciudad)}</div></div><i class="ti ti-chevron-right"></i></a></div></div>
<section style="padding-top:40px" id="rel"></section></div>`;
fab.style.cssText='background:'+col+';border-color:'+col;
(async()=>{const {data:o}=await sb.from('productos').select('*').eq('tienda_id',T.id).eq('activo',true).neq('id',p.id).limit(8);if(o&&o.length){PS=PS.concat(o.filter(x=>!P(x.id)));rel.innerHTML=`<div class="pl-eyb">De la misma tienda</div><h2 class="pl-h2">También te puede gustar</h2><div class="pt-car">${o.map(x=>plCard(x,{})).join('')}</div>`;window.rc&&rc()}})();
fab.classList.remove('hidden');initCheckout(T,P);window.rc=()=>{const car=carLeer(T.id);cn.textContent=Object.values(car).reduce((a,b)=>a+b,0);tt.textContent=soles(Object.entries(car).reduce((s,[i,n])=>s+(i==p.id?p.precio*n:0),0))};
// otros productos del carrito de esta tienda: cargar para el total correcto
const ids=Object.keys(carLeer(T.id)).filter(i=>i!=p.id);if(ids.length){const {data:o}=await sb.from('productos').select('*').in('id',ids);PS=PS.concat(o||[])}
window.rc=()=>{const car=carLeer(T.id),n=Object.entries(car).reduce((a,[i,k])=>a+(P(i)?k:0),0);cn.textContent=n;tt.textContent=soles(total());if(window.ptn)ptn.textContent=n};rc();resenas()})();
async function resenas(){const {data:r}=await sb.from('resenas').select('*').eq('producto_id',PR.id).order('creado',{ascending:false});const n=(r||[]).length,avg=n?r.reduce((s,x)=>s+x.estrellas,0)/n:0;
pst.innerHTML=n?`${estrellas(avg)} <span class="text-sm">${avg.toFixed(1)} · ${n} reseña${n>1?'s':''}</span>`:'<span class="text-sm text-gray-500">Sin reseñas todavía</span>';
secRes.innerHTML=`<div class="grid lg:grid-cols-3 gap-6"><div class="lg:col-span-2"><h2 class="text-lg mb-4">Reseñas de clientes</h2>${n?r.map(x=>`<div class="border-b border-gray-200 py-4"><div class="flex justify-between"><b class="text-gray-800">${esc(x.nombre)}</b><span class="text-sm">${new Date(x.creado).toLocaleDateString('es-PE')}</span></div>${estrellas(x.estrellas)}<span class="ml-2 text-sm text-green-700"><i class="ti ti-circle-check"></i> Compra verificada</span><p class="mt-1">${esc(x.comentario)}</p></div>`).join(''):'<p>Aún no hay reseñas. ¡Sé el primero!</p>'}</div>
<form id="fr" class="border border-gray-300 rounded-lg p-5 self-start"><h3 class="text-md mb-1">Deja tu reseña</h3><p class="text-sm mb-3">Solo con el código de tu pedido (ej. RM-0001).</p>
<label class="${LBL}">Código de pedido</label><input name="codigo" required placeholder="RM-0001" value="${esc(localStorage.getItem('rm_ultimo_pedido')||'')}" class="${INP} uppercase">
<label class="${LBL}">Calificación</label><div id="sel" class="text-3xl mb-3 cursor-pointer select-none"></div>
<label class="${LBL}">Tu nombre</label><input name="nombre" maxlength="40" class="${INP}"><label class="${LBL}">Comentario</label><textarea name="comentario" rows="3" maxlength="600" class="${INP}"></textarea>
<div id="fre" class="text-sm mb-2"></div><button class="${BTN} w-full">Publicar reseña</button></form></div>`;pintaSel();
fr.onsubmit=async e=>{e.preventDefault();const v=Object.fromEntries(new FormData(fr));const {error}=await sb.rpc('crear_resena',{p_codigo:v.codigo,p_producto:PR.id,p_estrellas:est,p_comentario:v.comentario,p_nombre:v.nombre});
if(error){fre.className='text-sm mb-2 text-red-600';fre.textContent=errTxt(error);return}aviso('¡Gracias por tu reseña!');resenas()}}
function pintaSel(){sel.innerHTML=[1,2,3,4,5].map(i=>`<span onclick="est=${i};pintaSel()" class="${i<=est?'text-yellow-500':'text-gray-300'}">★</span>`).join('')}
</script></body></html>
